<div class="sidebar-container">

  <!-- SIDEBAR HEADER -->
  <div class="sidebar-header">
    <div class="brand-icon">
      <mat-icon>dashboard</mat-icon>
    </div>

    <div class="brand-text">
      <h3>ERP SYSTEM</h3>
      <span>Management Portal</span>
    </div>
  </div>

  <!-- NAVIGATION -->
  <div class="sidebar-content">

    <div class="nav-section-title">MAIN MENU</div>

    <ng-container *ngFor="let module of moduleMenuList; let i = index">

      <!-- MODULE -->
      <div class="module-container">

        <button type="button" class="module-link" [class.module-active]="expandedModule === i"
          (click)="toggleModule(i, module)">

          <!-- <mat-icon class="module-icon">
            {{ getModuleIcon(module.moduleTitle) }}
          </mat-icon> -->

          <span class="module-title">
            {{ module.moduleTitle }}
          </span>

          <mat-icon class="expand-icon">
            {{ expandedModule === i ? 'expand_less' : 'expand_more' }}
          </mat-icon>

        </button>

        <!-- MODULE MENUS -->
        <div class="module-menus" *ngIf="expandedModule === i">

          <ng-container *ngFor="let menu of module.menus">

            <!-- MENU WITH SUBMENUS -->
            <ng-container *ngIf="(menu.menus?.length ?? 0) > 0; else singleMenu">

              <button type="button" class="menu-link" [class.menu-expanded]="expandedMenus[menu.menuID]"
                (click)="toggleMenu(menu.menuID)">

                <span class="menu-dot"></span>

                <span class="menu-title">
                  {{ menu.menuTitle }}
                </span>

                <mat-icon class="submenu-arrow">
                  {{
                  expandedMenus[menu.menuID]
                  ? 'keyboard_arrow_up'
                  : 'keyboard_arrow_down'
                  }}
                </mat-icon>

              </button>

              <!-- SUBMENUS -->
              <div class="submenu-container" *ngIf="expandedMenus[menu.menuID]">

                <a *ngFor="let sub of menu.menus" class="submenu-link"
                  [routerLink]="['/', sub.moduleLink, sub.menuLink]" routerLinkActive="active-submenu"
                  [routerLinkActiveOptions]="{ exact: true }">

                  <span class="submenu-line"></span>
                  <span>{{ sub.menuTitle }}</span>

                </a>

              </div>

            </ng-container>

            <!-- MENU WITHOUT SUBMENUS -->
            <ng-template #singleMenu>

              <a class="menu-link single-menu" [routerLink]="['/', menu.moduleLink, menu.menuLink]"
                routerLinkActive="active-menu" [routerLinkActiveOptions]="{ exact: true }">

                <span class="menu-dot"></span>

                <span class="menu-title">
                  {{ menu.menuTitle }}
                </span>

              </a>

            </ng-template>

          </ng-container>

        </div>

      </div>

    </ng-container>

  </div>

  <!-- SIDEBAR FOOTER -->
  <div class="sidebar-footer">
    <mat-icon>verified_user</mat-icon>
    <div>
      <strong>Developed By:</strong>
      <span>LOGIX SOLUTIONZ</span>
    </div>
  </div>

</div>
