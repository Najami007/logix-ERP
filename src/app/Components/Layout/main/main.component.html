
<mat-drawer-container
  class="displayMainPage"
  autosize>

  <!-- SIDEBAR -->
  <mat-drawer
    #drawer
    mode="side"
    position="start"
    [opened]="sideBarOpen"
    class="app-sidebar">

    <app-side-navbar
      *ngIf="moduleWiseNavigationFeature">
    </app-side-navbar>

    <app-side-navigation-bar2
      *ngIf="!moduleWiseNavigationFeature">
    </app-side-navigation-bar2>

  </mat-drawer>

  <!-- MAIN APPLICATION AREA -->
  <mat-drawer-content class="layout-content">

    <!-- TOP NAVIGATION -->
    <header
      class="topBar"
      id="menubar"
      *ngIf="hideFlag === false">

      <app-top-nav-bar
        (toggleMySideBar)="sideBarToggler()">
      </app-top-nav-bar>

    </header>

    <!-- PAGE CONTENT -->
    <main class="main-content">

      <div class="bodyContainer">
        <router-outlet></router-outlet>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <app-header></app-header>
    </footer>

  </mat-drawer-content>

</mat-drawer-container>
