<div class="p-2">

    <div class="d-flex justify-content-center gap-2">
        <mat-form-field class="col-lg-3 matSmall" appearance="outline">
            <mat-label>From Date</mat-label>
            <input matInput type="text" readonly="true" (dateChange)="getData()" [(ngModel)]="fromDate"
                [matDatepicker]="sDate">
            <mat-datepicker-toggle matSuffix [for]="sDate"></mat-datepicker-toggle>
            <mat-datepicker #sDate></mat-datepicker>
        </mat-form-field>

        <mat-form-field class="col-lg-3 matSmall" appearance="outline">
            <mat-label>To Date</mat-label>
            <input matInput type="text" readonly="true" (dateChange)="getData()" [(ngModel)]="toDate"
                [matDatepicker]="eDate">
            <mat-datepicker-toggle matSuffix [for]="eDate"></mat-datepicker-toggle>
            <mat-datepicker #eDate></mat-datepicker>
        </mat-form-field>

        <div class=" col-md-2"><button class="w-100 btn-rpt-primary" (click)="printDashboard()">
                Print</button></div>
    </div>

    <div id="printRpt">
        <div class="row align-items-stretch">

            <div class="col-md-9 d-flex">
                <div class="mb-1 mat-elevation-z2 w-100 h-100" [chart]="mining_dashboard_chart">
                </div>
            </div>

            <div class="col-md-3 d-flex">
                <div class="mat-elevation-z2 p-2 bg-white w-100 h-100">
                    <table class="table mb-0">
                        <tbody>
                            <tr *ngFor="let item of dataList1">
                                <td class="fw-bold">{{item.Title}}</td>
                                <td class="text-end">
                                    {{item.value | number:'1.0-0'}}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

        <div class="row align-items-stretch mt-1">

            <div class="col-md-9 d-flex">
                <div class="mb-1 mat-elevation-z2 w-100 h-100" [chart]="mining_dashboard_chart2">
                </div>
            </div>

            <div class="col-md-3 d-flex">
                <div class="mat-elevation-z2 p-2 bg-white w-100 h-100">
                    <table class="table mb-0">
                        <tbody>
                            <tr *ngFor="let item of dataList2">
                                <td class="fw-bold">{{item.Title}}</td>
                                <td class="text-end">
                                    {{item.value | number:'1.0-0'}}
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
