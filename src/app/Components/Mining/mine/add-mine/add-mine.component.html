<div class="d-flex flex-column justify-content-center container">
    <form class="mine-form " (ngSubmit)="onSubmit()">

        <header class="form-header">

            <div class="titles">
                <h1>{{editMode ? 'Edit' : 'Add'}} Mine</h1>
            </div>


        </header>



        <section class="container p-2">

            <mat-form-field appearance="outline" class="matSmall w-100">
                <mat-label>Mine name</mat-label>
                <input matInput name="mineName" [(ngModel)]="model.mineName" placeholder="e.g. Mine 1234"
                    autocomplete="off" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="matSmall w-100">
                <mat-label>Description</mat-label>

                <textarea matInput name="description" [(ngModel)]="model.description" autocomplete="off"> </textarea>
            </mat-form-field>
        </section>


        <footer class="form-actions">

            <button mat-stroked-button type="button" (click)="resetForm()">
                Cancel
            </button>

            <button mat-flat-button color="primary" type="submit" accesskey="s">
                Save
            </button>

        </footer>

    </form>


    <div>

        <div class="filters">
            <mat-form-field appearance="outline" class="w-100 matSmall" subscriptSizing="dynamic">
                <mat-label>Search Mines</mat-label>
                <input matInput #searchMine placeholder="Mine Name" autocomplete="off" />
                <!-- <mat-icon matPrefix>search</mat-icon> -->
                <button mat-icon-button matSuffix *ngIf="searchMine.value" type="button" aria-label="Clear search">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>

        </div>


        <div>
            <table class="table table-hover table-logix" style="font-size: 12px;">
                <thead>
                    <tr>
                        <th>S#</th>
                        <th>Mine Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr *ngFor="let item of savedMines | filter:searchMine.value  |paginate:{
                        itemsPerPage : tableSize,
                        currentPage : page,
                        totalItems :    count,
                    }   index as i">
                        <td class="text-center">{{i+1}}</td>
                        <td>{{item.mineName}}</td>
                        <td>{{item.description}}</td>

                        <td class="cursorPointer text-center">
                            <mat-icon class="text-success" matTooltip="Edit mine"
                                (click)="editMine(item)">edit</mat-icon>

                            <mat-icon class="text-danger" matTooltip="Delete mine"
                                (click)="deleteMine(item)">delete</mat-icon>

                        </td>

                    </tr>

                    <tr *ngIf="savedMines?.length == 0">
                        <ng-template>
                            <p class="empty-title">No mines match your search</p>
                            <p>Try a different word, or clear the filters.</p>
                        </ng-template>
                    </tr>

                </tbody>

            </table>
        </div>

        <div class="d-flex">

            <pagination-controls previousLabel="Prev" nextLabel="Next"
                (pageChange)="onTableDataChange($event)"></pagination-controls>


            <mat-hint class=" me-1 text-secondary">Rows Per Page </mat-hint>
            <select class="text-white" style="height: 25px;background-color: rgb(75, 164, 248);"
                (change)="onTableSizeChange($event)" [(ngModel)]="tableSize">
                <option *ngFor=" let item of tableSizes" [selected]="tableSize == item">{{item}}</option>
            </select>

            <!-- <div class="jump-to-page">
        <input type="text" class="w-25" (keydown)="global.handleNumKeys($event)" [(ngModel)]="jumpPage"
            placeholder="Page #" min="1" [max]="count" />
        <button (click)="goToPage()" class="text-white"
            style="height: 25px;background-color: rgb(75, 164, 248);border: 1px solid black;">Go</button>
    </div> -->

        </div>




    </div>
</div>
