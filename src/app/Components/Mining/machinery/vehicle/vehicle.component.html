
<mat-sidenav-container class="body">
  <mat-sidenav
    #drawer
    mode="over"
    position="end"
    class="form-drawer"
    [(opened)]="drawerOpen"
    (closedStart)="onDrawerClose()">

    <div class="drawer-header">
      <h2>{{ editingVehicle ? 'Edit Vehicle' : 'Add Vehicle' }}</h2>
      <button mat-icon-button (click)="drawer.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <app-add-vehicle
      (saveVehicle)="saveVehicle($event.type, $event.load)">
    </app-add-vehicle>
  </mat-sidenav>

  <mat-sidenav-content>
    <button
      mat-fab
      extended
      color="primary"
      class="fab"
      (click)="newVehicle(); drawer.open()">
      <mat-icon>add</mat-icon>
      Add Vehicle
    </button>

    <app-saved-vehicles
      [vehicles]="vehicleList | filter:searchText"
      (statusChange)="saveVehicle($event.type, $event.load)"
      (remove)="saveVehicle($event.type, $event.load)"
      (edit)="editVehicle($event); drawer.open()">
    </app-saved-vehicles>
  </mat-sidenav-content>
</mat-sidenav-container>
